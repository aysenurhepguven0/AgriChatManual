<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>AgriChat — QR Kart</title>
<style>
  @page { size: A6; margin: 0; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f9fafb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    width: 105mm;
    height: 148mm;
    background: white;
    padding: 14mm 10mm;
    box-sizing: border-box;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    border-top: 8mm solid #14532d;
  }
  .logo { font-size: 36px; margin-bottom: 4px; }
  h1 {
    margin: 0 0 4px;
    font-size: 24px;
    color: #14532d;
    letter-spacing: -0.01em;
  }
  .tag {
    color: #15803d;
    font-size: 13px;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .qr {
    width: 60mm;
    height: 60mm;
    margin: 6mm 0;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 4px;
    background: white;
  }
  .qr img { width: 100%; height: 100%; display: block; }
  .instr {
    font-size: 13px;
    color: #374151;
    line-height: 1.5;
    margin: 0;
  }
  .instr strong { color: #14532d; }
  .footer {
    margin-top: auto;
    font-size: 10px;
    color: #6b7280;
  }
  @media print {
    body { background: white; }
    .card { box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🌱</div>
    <h1>AgriChat</h1>
    <div class="tag">Kullanım Kılavuzu</div>

    <div class="qr">
      <img src="qr.png" alt="Kullanım kılavuzu QR kodu" />
    </div>

    <p class="instr">
      <strong>Telefon kameranızı</strong> QR koda doğrultun.<br/>
      Çıkan bağlantıya dokunarak kılavuzu açın.
    </p>

    <div class="footer">© 2026 AgriChat · v1.0</div>
  </div>
</body>
</html>
